; Keep indoor local-light shadows crisp while lights/players move.
; Use quality-specific overrides so lower presets retain their memory budget.
[ShadowQuality@2]
r.Shadow.Virtual.MaxPhysicalPages=4096
r.Shadow.Virtual.ResolutionLodBiasLocal=-1.0
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=0.0

[ShadowQuality@3]
r.Shadow.Virtual.MaxPhysicalPages=8192
r.Shadow.Virtual.ResolutionLodBiasLocal=-1.0
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=0.0
; Keep the local shadow-map resolution, but use four rays for the soft edge.
r.Shadow.Virtual.SMRT.RayCountLocal=4
